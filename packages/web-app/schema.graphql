"""Checkout input"""
input CheckoutInput {
  count: Int!
  id: ID!
}

type ConversionMetrics {
  bounceRate: Float
  id: ID
  ignoreRate: Float
  interested: Float
  meetingRate: Float
  notInterested: Float
  oooRate: Float
  referralRate: Float
  unsubscribeRate: Float
}

"""Conversion metrics input"""
input ConversionMetricsInput {
  bounceRate: Int
  ignoreRate: Int
  interested: Int
  meetingRate: Int
  notInterested: Int
  oooRate: Int
  referralRate: Int
  unsubscribeRate: Int
}

scalar DateTime

"""An Email Record"""
type EmailRecord {
  body: String
  bounced: Boolean
  id: ID
  prospect: Prospect
  sentAt: DateTime
  subject: String
}

"""The schema root for mutating data"""
type Mutation {
  """Checkout cart"""
  checkout(cart: [CheckoutInput!]!): [Product!]

  """Configure conversion metrics"""
  configureConversionMetrics(metrics: ConversionMetricsInput!): ConversionMetrics

  """Configure the number of days to wait between emails"""
  configureWaitInterval(days: Int!): WorkflowStatus

  """Fast forward the current time by the specified number of days"""
  fastForward(days: Int!): WorkflowStatus
}

"""A Product"""
type Product {
  description: String
  id: ID
  imageUrl: String
  name: String
  price: Int
  stockCount: Int
  summary: String
}

"""A Prospect"""
type Prospect {
  company: String
  email: String
  id: ID
  isDeactivated: Boolean
  name: String
  nextEmail: EmailRecord
  replyEmail: EmailRecord
  replyIntent: ReplyIntent
  role: String
  sentEmails: [EmailRecord!]
  status: String
  timezone: String
  waitDays: Int
}

type ProspectStats {
  activePercent: Float
  activeProspects: Int
  deactivatedPercent: Float
  deactivatedProspects: Int
  sendingTodayCount: Int
  sendingTomorrowCount: Int
  statusBreakdown: [ProspectStatusStats!]
  totalProspects: Int
}

type ProspectStatusStats {
  count: Int
  percent: Float
  status: String
}

"""The schema root for fetching data."""
type Query {
  """Conversion metrics"""
  conversionMetrics: ConversionMetrics

  """Fetch a product by id."""
  productById(id: ID!): Product

  """List of available products."""
  products: [Product!]

  """Prospect counts and percentages by activation and status."""
  prospectStats: ProspectStats

  """
  List of prospects, their contact details, and their status in the workflow sequence.
  """
  prospects: [Prospect!]
  workflowStatus: WorkflowStatus
}

scalar ReplyIntent

"""The schema root for subscriptions"""
type Subscription {
  """Updates the available stock in real-time."""
  productUpdates: [Product!]
}

type WorkflowStatus {
  currentTime: DateTime
  waitIntervalDays: Int
}
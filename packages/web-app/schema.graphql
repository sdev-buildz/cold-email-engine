"""Checkout input"""
input CheckoutInput {
  count: Int!
  id: ID!
}

scalar DateTime

"""An Email Record"""
type EmailRecord {
  body: String
  bounced: Boolean
  id: ID
  prospect: Prospect
  sentAt: DateTime
  subject: String
}

"""The schema root for mutating data"""
type Mutation {
  """Checkout cart"""
  checkout(cart: [CheckoutInput!]!): [Product!]
}

"""A Product"""
type Product {
  description: String
  id: ID
  imageUrl: String
  name: String
  price: Int
  stockCount: Int
  summary: String
}

"""A Prospect"""
type Prospect {
  email: String
  id: ID
  isDeactivated: Boolean
  name: String
  nextEmail: EmailRecord
  replyEmail: EmailRecord
  replyIntent: ReplyIntent
  role: String
  sentEmails: [EmailRecord!]
  status: String
  timezone: String
  waitDays: Int
}

"""The schema root for fetching data."""
type Query {
  """Fetch a product by id."""
  productById(id: ID!): Product

  """List of available products."""
  products: [Product!]

  """
  List of prospects, their contact details, and their status in the workflow sequence.
  """
  prospects: [Prospect!]
}

scalar ReplyIntent

"""The schema root for subscriptions"""
type Subscription {
  """Updates the available stock in real-time."""
  productUpdates: [Product!]
}